
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#101827">

    <title>Admin Login | Along Digital</title>

    <link rel="stylesheet" href="login.css">

    <!-- Google reCAPTCHA v2 -->
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>
</head>


<body>

    <!-- Background -->
    <div class="background"></div>
    <div class="background-overlay"></div>

    <main class="auth-container">

        <section class="auth-card">

            <!-- Brand -->
            <div class="brand">
                <div class="brand-logo">A</div>
                <h2>Along Digital</h2>
                <p>Secure Administration Portal</p>
            </div>

            <!-- Heading -->
            <div class="auth-heading">
                <span class="top-badge">ADMIN ACCESS</span>
                <h1>Welcome Back</h1>
                <p>Sign in to continue to your dashboard.</p>
            </div>

            <!-- Login Form -->
            <form id="loginForm">

                <div class="form-group">
                    <label for="loginIdentity">Email or Mobile Number</label>
                    <input
                        type="text"
                        id="loginIdentity"
                        name="loginIdentity"
                        placeholder="Enter your email or mobile"
                        autocomplete="username"
                        required
                    >
                </div>

                <div class="form-group">
                    <div class="password-heading">
                        <label for="password">Password</label>
                        <a href="forget.html">
                            Forgot Password?
                        </a>
                    </div>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <!-- Remember Me -->
                <div class="remember-row">
                    <label>
                        <input type="checkbox" id="rememberMe">
                        Remember me
                    </label>
                </div>

                <!-- Google reCAPTCHA -->
                <div class="captcha-container">
                    <div
                        class="g-recaptcha"
                        data-sitekey="YOUR_RECAPTCHA_SITE_KEY">
                    </div>
                </div>

                <!-- Terms -->
                <div class="terms-row">
                    <label>
                        <input type="checkbox" id="loginTerms" required>
                        I agree to the
                        <a href="terms.html">Terms & Conditions</a>
                        and
                        <a href="privacy.html">Privacy Policy</a>.
                    </label>
                </div>

                <!-- Login Button -->
                <button type="submit" id="loginBtn" class="auth-btn">
                    Sign In
                </button>

                <!-- Message -->
                <p id="authMessage" class="auth-message" aria-live="polite"></p>

            </form>

            <!-- Divider -->
            <div class="divider">
                <span>OR CONTINUE WITH</span>
            </div>

            <!-- Google Login -->
            <button type="button" id="googleLogin" class="google-btn">
                <img
                    src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg"
                    alt=""
                >
                Continue with Google
            </button>

            <!-- Signup -->
            <div class="signup-link">
                <p>
                    Don't have an account?
                    <a href="signup.html">Create Account</a>
                </p>

                <p>
                    Want to apply for access?
                    <a href="apply.html">Submit Application</a>
                </p>
            </div>

            <!-- Footer -->
            <div class="auth-footer">
                <span>Protected Admin Portal</span>
                <span>© 2026 Your Brand</span>
            </div>

        </section>

    </main>

    <!-- Configuration and JavaScript -->
    <script src="../asset.js"></script>
    <script src="../script.js"></script>

</body>
</html>
