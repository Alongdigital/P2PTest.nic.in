<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EduTech AI Chatbot</title>

    <!-- CSS -->
    <style>
/* ================================
   EduTech AI Chatbot
   Main CSS
================================ */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --bg: #ffffff;
    --header: #ffffff;
    --chat-bg: #f7f7f8;
    --text: #202123;
    --muted: #6b7280;
    --border: #e5e7eb;
    --input: #ffffff;
    --user: #2563eb;
    --user-text: #ffffff;
    --ai: #ffffff;
    --shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
}

body.dark {
    --bg: #111827;
    --header: #111827;
    --chat-bg: #0b1120;
    --text: #f3f4f6;
    --muted: #9ca3af;
    --border: #273244;
    --input: #1f2937;
    --user: #2563eb;
    --user-text: #ffffff;
    --ai: #1f2937;
    --shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
}

body {
    font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

    background: var(--bg);
    color: var(--text);

    height: 100vh;
    overflow: hidden;

    transition:
        background 0.25s ease,
        color 0.25s ease;
}


/* ================================
   APP
================================ */

.app {
    width: 100%;
    height: 100vh;

    display: flex;
    flex-direction: column;

    background: var(--chat-bg);
}


/* ================================
   HEADER
================================ */

.chat-header {
    height: 70px;
    min-height: 70px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 22px;

    background: var(--header);
    border-bottom: 1px solid var(--border);

    position: relative;
    z-index: 10;
}

.brand {
    display: flex;
    align-items: center;
    gap: 12px;
}

.ai-logo {
    width: 42px;
    height: 42px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 13px;

    background: linear-gradient(
        135deg,
        #2563eb,
        #7c3aed
    );

    color: white;

    font-size: 14px;
    font-weight: 800;

    box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
}

.brand-info h1 {
    font-size: 17px;
    font-weight: 700;

    line-height: 20px;
}

.status {
    display: flex;
    align-items: center;
    gap: 5px;

    color: #22c55e;

    font-size: 12px;
    margin-top: 2px;
}

.status i {
    width: 7px;
    height: 7px;

    background: #22c55e;

    border-radius: 50%;

    display: inline-block;
}

.header-actions {
    display: flex;
    gap: 7px;
}

.header-actions button {
    width: 40px;
    height: 40px;

    border: none;
    border-radius: 10px;

    background: transparent;
    color: var(--text);

    cursor: pointer;

    font-size: 17px;

    transition:
        background 0.2s ease,
        transform 0.2s ease;
}

.header-actions button:hover {
    background: var(--chat-bg);
    transform: translateY(-1px);
}


/* ================================
   CHAT BOX
================================ */

.chat-box {
    flex: 1;

    overflow-y: auto;

    padding: 30px 18px 35px;

    scroll-behavior: smooth;
}


/* Scrollbar */

.chat-box::-webkit-scrollbar {
    width: 7px;
}

.chat-box::-webkit-scrollbar-track {
    background: transparent;
}

.chat-box::-webkit-scrollbar-thumb {
    background: #c7cbd1;
    border-radius: 10px;
}

body.dark .chat-box::-webkit-scrollbar-thumb {
    background: #374151;
}


/* ================================
   MESSAGE
================================ */

.message {
    width: min(850px, 100%);

    margin: 0 auto 25px;

    display: flex;
    gap: 12px;

    animation: messageIn 0.25s ease;
}

@keyframes messageIn {
    from {
        opacity: 0;
        transform: translateY(7px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.avatar {
    width: 36px;
    height: 36px;

    min-width: 36px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 11px;

    background: linear-gradient(
        135deg,
        #2563eb,
        #7c3aed
    );

    color: white;

    font-size: 11px;
    font-weight: 800;
}

.message-content {
    max-width: calc(100% - 48px);
}

.message-name {
    font-size: 12px;
    font-weight: 700;

    margin-bottom: 5px;

    color: var(--muted);
}


/* ================================
   AI BUBBLE
================================ */

.bubble {
    background: var(--ai);

    border: 1px solid var(--border);

    border-radius: 4px 16px 16px 16px;

    padding: 14px 16px;

    box-shadow: var(--shadow);

    line-height: 1.6;

    font-size: 15px;

    word-wrap: break-word;
}

.bubble p + p {
    margin-top: 8px;
}


/* ================================
   USER MESSAGE
================================ */

.user-message {
    justify-content: flex-end;
}

.user-message .avatar {
    order: 2;

    background: var(--user);
}

.user-message .message-content {
    order: 1;

    display: flex;
    flex-direction: column;
    align-items: flex-end;
}

.user-message .message-name {
    display: none;
}

.user-message .bubble {
    background: var(--user);
    color: var(--user-text);

    border: none;

    border-radius: 16px 4px 16px 16px;

    box-shadow: none;
}

.user-message .message-time {
    text-align: right;
}


/* ================================
   MESSAGE TIME
================================ */

.message-time {
    color: var(--muted);

    font-size: 10px;

    margin-top: 5px;
}


/* ================================
   TYPING
================================ */

.typing-container {
    width: min(850px, calc(100% - 36px));

    margin: 0 auto 15px;

    display: flex;
    align-items: center;

    gap: 12px;
}

.typing {
    height: 36px;

    padding: 0 14px;

    display: flex;
    align-items: center;
    gap: 4px;

    background: var(--ai);

    border: 1px solid var(--border);

    border-radius: 4px 14px 14px 14px;
}

.typing span {
    width: 6px;
    height: 6px;

    background: var(--muted);

    border-radius: 50%;

    animation: typing 1.2s infinite ease-in-out;
}

.typing span:nth-child(2) {
    animation-delay: 0.15s;
}

.typing span:nth-child(3) {
    animation-delay: 0.3s;
}

@keyframes typing {
    0%,
    60%,
    100% {
        transform: translateY(0);
        opacity: 0.4;
    }

    30% {
        transform: translateY(-5px);
        opacity: 1;
    }
}

.hidden {
    display: none !important;
}


/* ================================
   INPUT AREA
================================ */

.input-area {
    width: 100%;

    padding: 12px 18px 18px;

    background: var(--chat-bg);
}

.input-wrapper {
    width: min(850px, 100%);

    margin: auto;

    min-height: 58px;

    display: flex;
    align-items: flex-end;

    padding: 8px 8px 8px 17px;

    background: var(--input);

    border: 1px solid var(--border);

    border-radius: 17px;

    box-shadow: var(--shadow);

    transition:
        border 0.2s ease,
        box-shadow 0.2s ease;
}

.input-wrapper:focus-within {
    border-color: #2563eb;

    box-shadow:
        0 0 0 3px rgba(37, 99, 235, 0.1);
}

#messageInput {
    flex: 1;

    width: 100%;

    min-height: 40px;
    max-height: 150px;

    resize: none;

    border: none;
    outline: none;

    background: transparent;

    color: var(--text);

    font-family: inherit;
    font-size: 15px;

    line-height: 22px;

    padding: 9px 8px 8px 0;
}

#messageInput::placeholder {
    color: var(--muted);
}


/* ================================
   SEND BUTTON
================================ */

.send-btn {
    width: 42px;
    height: 42px;

    min-width: 42px;

    border: none;
    border-radius: 12px;

    background: var(--user);

    color: white;

    font-size: 19px;

    display: flex;
    align-items: center;
    justify-content: center;

    cursor: pointer;

    transition:
        transform 0.2s ease,
        opacity 0.2s ease;
}

.send-btn:hover {
    transform: scale(1.05);
}

.send-btn:active {
    transform: scale(0.95);
}

.send-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}


/* ================================
   INPUT FOOTER
================================ */

.input-footer {
    width: min(850px, 100%);

    margin: 7px auto 0;

    padding: 0 4px;

    display: flex;
    justify-content: space-between;
    gap: 10px;

    color: var(--muted);

    font-size: 10px;
}


/* ================================
   MOBILE
================================ */

@media (max-width: 600px) {

    .chat-header {
        height: 62px;
        min-height: 62px;

        padding: 0 14px;
    }

    .ai-logo {
        width: 38px;
        height: 38px;

        border-radius: 11px;
    }

    .brand-info h1 {
        font-size: 15px;
    }

    .header-actions button {
        width: 36px;
        height: 36px;
    }

    .chat-box {
        padding: 20px 12px 25px;
    }

    .message {
        gap: 8px;

        margin-bottom: 20px;
    }

    .avatar {
        width: 32px;
        height: 32px;
        min-width: 32px;

        border-radius: 9px;
    }

    .message-content {
        max-width: calc(100% - 40px);
    }

    .bubble {
        font-size: 14px;
        padding: 11px 13px;
    }

    .typing-container {
        width: calc(100% - 24px);
    }

    .input-area {
        padding: 8px 10px 12px;
    }

    .input-wrapper {
        min-height: 53px;
        border-radius: 15px;

        padding-left: 13px;
    }

    #messageInput {
        font-size: 14px;
    }

    .send-btn {
        width: 38px;
        height: 38px;
        min-width: 38px;

        border-radius: 10px;
    }

    .input-footer {
        font-size: 9px;
    }
}


/* ================================
   VERY SMALL SCREEN
================================ */

@media (max-width: 380px) {

    .status {
        display: none;
    }

    .input-footer span:first-child {
        display: none;
    }

    .input-footer {
        justify-content: flex-end;
    }
}
</style>
</head>

<body>

    <!-- App Container -->
    <div class="app">

        <!-- Header -->
        <header class="chat-header">
            <div class="brand">
                <div class="ai-logo">AI</div>

                <div class="brand-info">
                    <h1>EduTech AI</h1>
                    <span class="status">
                        <i></i> Online
                    </span>
                </div>
            </div>

            <div class="header-actions">
                <button id="themeBtn" title="Change Theme">
                    🌙
                </button>

                <button id="clearBtn" title="Clear Chat">
                    🗑️
                </button>
            </div>
        </header>


        <!-- Chat Area -->
        <main id="chatBox" class="chat-box">

            <!-- Welcome Message -->
            <div class="message ai-message">
                <div class="avatar">AI</div>

                <div class="message-content">
                    <div class="message-name">EduTech AI</div>

                    <div class="bubble">
                        <p>
                            👋 Hello! I'm EduTech AI.
                        </p>

                        <p>
                            Ask me anything about your studies,
                            programming, science, mathematics and more.
                        </p>
                    </div>

                    <div class="message-time">
                        Just now
                    </div>
                </div>
            </div>

        </main>


        <!-- Typing Indicator -->
        <div id="typing" class="typing-container hidden">

            <div class="avatar">AI</div>

            <div class="typing">
                <span></span>
                <span></span>
                <span></span>
            </div>

        </div>


        <!-- Input Area -->
        <footer class="input-area">

            <div class="input-wrapper">

                <textarea
                    id="messageInput"
                    rows="1"
                    maxlength="4000"
                    placeholder="Message EduTech AI..."
                    autocomplete="off"
                ></textarea>

                <button
                    id="sendBtn"
                    class="send-btn"
                    title="Send Message"
                    type="button"
                >
                    ➤
                </button>

            </div>

            <div class="input-footer">
                <span>EduTech AI can make mistakes. Check important information.</span>
                <span id="charCount">0 / 4000</span>
            </div>

        </footer>

    </div>


    <!-- JavaScript -->
    <script>
/* =========================================
   EduTech AI Chatbot
   script.js
========================================= */


/* =========================================
   CONFIGURATION
========================================= */

// Demo API key supplied by user
const API_KEY =
    "AQ.Ab8RN6JSf9K4b7ySt2TMLwf94kNoDjcHwE4QwWHxt6ulXJbYoQ";

// Gemini model
const MODEL = "gemini-3.1-flash-lite";

// Gemini API endpoint
const API_URL =
    `https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent`;


/* =========================================
   DOM ELEMENTS
========================================= */

const chatBox = document.getElementById("chatBox");
const messageInput = document.getElementById("messageInput");
const sendBtn = document.getElementById("sendBtn");

const typing = document.getElementById("typing");

const clearBtn = document.getElementById("clearBtn");
const themeBtn = document.getElementById("themeBtn");

const charCount = document.getElementById("charCount");


/* =========================================
   CHAT HISTORY
========================================= */

let conversation = [];

try {
    const savedChat = localStorage.getItem("edutech_chat");

    if (savedChat) {
        conversation = JSON.parse(savedChat);
    }
} catch (error) {
    conversation = [];
}


/* =========================================
   LOAD SAVED CHAT
========================================= */

function loadChat() {

    if (!conversation.length) {
        return;
    }

    // Remove default welcome message
    chatBox.innerHTML = "";

    conversation.forEach(message => {

        addMessage(
            message.role,
            message.text,
            false
        );

    });
}


/* =========================================
   SAVE CHAT
========================================= */

function saveChat() {

    try {

        localStorage.setItem(
            "edutech_chat",
            JSON.stringify(conversation)
        );

    } catch (error) {

        console.warn(
            "Could not save chat:",
            error
        );

    }
}


/* =========================================
   ADD MESSAGE TO UI
========================================= */

function addMessage(role, text, animate = true) {

    const message = document.createElement("div");

    message.className =
        role === "user"
            ? "message user-message"
            : "message ai-message";

    if (!animate) {
        message.style.animation = "none";
    }


    const avatar = document.createElement("div");

    avatar.className = "avatar";

    avatar.textContent =
        role === "user"
            ? "U"
            : "AI";


    const content = document.createElement("div");

    content.className = "message-content";


    const name = document.createElement("div");

    name.className = "message-name";

    name.textContent =
        role === "user"
            ? "You"
            : "EduTech AI";


    const bubble = document.createElement("div");

    bubble.className = "bubble";


    /*
       Basic text formatting.
       This keeps the response as text rather
       than directly inserting arbitrary HTML.
    */

    bubble.innerHTML = formatText(text);


    const time = document.createElement("div");

    time.className = "message-time";

    time.textContent = getTime();


    content.appendChild(name);
    content.appendChild(bubble);
    content.appendChild(time);

    message.appendChild(avatar);
    message.appendChild(content);

    chatBox.appendChild(message);


    scrollToBottom();

    return message;
}


/* =========================================
   TEXT FORMATTER
========================================= */

function formatText(text) {

    if (!text) {
        return "";
    }


    // Escape HTML
    const escaped = text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");


    // Convert simple markdown-like formatting
    return escaped
        .replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>")
        .replace(/\*(.*?)\*/g, "<em>$1</em>")
        .replace(/`([^`]+)`/g, "<code>$1</code>")
        .replace(/\n/g, "<br>");
}


/* =========================================
   CURRENT TIME
========================================= */

function getTime() {

    return new Date().toLocaleTimeString(
        [],
        {
            hour: "2-digit",
            minute: "2-digit"
        }
    );

}


/* =========================================
   SCROLL
========================================= */

function scrollToBottom() {

    setTimeout(() => {

        chatBox.scrollTo({
            top: chatBox.scrollHeight,
            behavior: "smooth"
        });

    }, 50);

}


/* =========================================
   TYPING INDICATOR
========================================= */

function showTyping() {

    typing.classList.remove("hidden");

    scrollToBottom();

}


function hideTyping() {

    typing.classList.add("hidden");

}


/* =========================================
   SEND MESSAGE
========================================= */

async function sendMessage() {

    const text = messageInput.value.trim();


    // Don't send empty message
    if (!text) {
        return;
    }


    // Prevent duplicate requests
    sendBtn.disabled = true;


    // Add user message
    addMessage(
        "user",
        text
    );


    // Save user message
    conversation.push({
        role: "user",
        text: text
    });

    saveChat();


    // Clear input
    messageInput.value = "";

    updateCharacterCount();

    autoResize();


    // Show typing
    showTyping();


    try {

        const response =
            await askGemini();


        hideTyping();


        // Add AI message
        addMessage(
            "ai",
            response
        );


        // Save AI response
        conversation.push({
            role: "ai",
            text: response
        });

        saveChat();


    } catch (error) {

        hideTyping();


        console.error(error);


        let errorMessage =
            "Sorry, something went wrong while contacting the AI.";


        if (
            error.message &&
            error.message.includes("403")
        ) {

            errorMessage =
                "API key is invalid or does not have permission to use this API.";

        } else if (
            error.message &&
            error.message.includes("429")
        ) {

            errorMessage =
                "Too many requests. Please wait a moment and try again.";

        } else if (
            error.message &&
            error.message.includes("404")
        ) {

            errorMessage =
                "The selected Gemini model is unavailable.";

        }


        addMessage(
            "ai",
            errorMessage
        );

    } finally {

        sendBtn.disabled = false;

        messageInput.focus();

    }

}


/* =========================================
   GEMINI API
========================================= */

async function askGemini() {

    /*
       Convert local chat history into Gemini
       conversation format.
    */

    const contents = conversation.map(message => {

        return {

            role:
                message.role === "user"
                    ? "user"
                    : "model",

            parts: [
                {
                    text: message.text
                }
            ]

        };

    });


    const response = await fetch(
        API_URL,
        {

            method: "POST",

            headers: {

                "Content-Type":
                    "application/json",

                "x-goog-api-key":
                    API_KEY

            },

            body: JSON.stringify({

                contents: contents,

                systemInstruction: {

                    parts: [
                        {
                            text:
                                "You are EduTech AI, a helpful educational AI assistant. Explain concepts clearly and simply. Help students with mathematics, physics, chemistry, computer science, programming and general educational questions. When solving numerical problems, show the important steps."
                        }
                    ]

                },

                generationConfig: {

                    temperature: 0.7,

                    maxOutputTokens: 2048

                }

            })

        }
    );


    if (!response.ok) {

        const errorText =
            await response.text();

        throw new Error(
            `${response.status}: ${errorText}`
        );

    }


    const data =
        await response.json();


    /*
       Extract generated text
    */

    const result =
        data?.candidates?.[0]?.content?.parts
            ?.map(part => part.text || "")
            .join("");


    if (!result) {

        throw new Error(
            "Empty response received from Gemini."
        );

    }


    return result;

}


/* =========================================
   ENTER KEY
========================================= */

messageInput.addEventListener(
    "keydown",
    function (event) {

        if (
            event.key === "Enter" &&
            !event.shiftKey
        ) {

            event.preventDefault();

            sendMessage();

        }

    }
);


/* =========================================
   SEND BUTTON
========================================= */

sendBtn.addEventListener(
    "click",
    sendMessage
);


/* =========================================
   AUTO RESIZE TEXTAREA
========================================= */

function autoResize() {

    messageInput.style.height = "auto";

    messageInput.style.height =
        Math.min(
            messageInput.scrollHeight,
            150
        ) + "px";

}


messageInput.addEventListener(
    "input",
    function () {

        autoResize();

        updateCharacterCount();

    }
);


/* =========================================
   CHARACTER COUNT
========================================= */

function updateCharacterCount() {

    const length =
        messageInput.value.length;

    charCount.textContent =
        `${length} / 4000`;

}


/* =========================================
   CLEAR CHAT
========================================= */

clearBtn.addEventListener(
    "click",
    function () {

        const confirmed =
            confirm(
                "Clear your entire chat?"
            );


        if (!confirmed) {
            return;
        }


        conversation = [];


        localStorage.removeItem(
            "edutech_chat"
        );


        chatBox.innerHTML = `

            <div class="message ai-message">

                <div class="avatar">
                    AI
                </div>

                <div class="message-content">

                    <div class="message-name">
                        EduTech AI
                    </div>

                    <div class="bubble">

                        <p>
                            👋 Hello! I'm EduTech AI.
                        </p>

                        <p>
                            Ask me anything about your
                            studies, programming, science,
                            mathematics and more.
                     founder/author is Shankar Singh Rajput.
                        </p>

                    </div>

                    <div class="message-time">
                        Just now
                    </div>

                </div>

            </div>

        `;

    }
);


/* =========================================
   DARK / LIGHT MODE
========================================= */

function setTheme(theme) {

    if (theme === "dark") {

        document.body.classList.add("dark");

        themeBtn.textContent = "☀️";

    } else {

        document.body.classList.remove("dark");

        themeBtn.textContent = "🌙";

    }


    localStorage.setItem(
        "edutech_theme",
        theme
    );

}


themeBtn.addEventListener(
    "click",
    function () {

        const isDark =
            document.body.classList.contains("dark");


        setTheme(
            isDark
                ? "light"
                : "dark"
        );

    }
);


/* =========================================
   LOAD THEME
========================================= */

const savedTheme =
    localStorage.getItem(
        "edutech_theme"
    );


if (savedTheme) {

    setTheme(savedTheme);

} else if (
    window.matchMedia &&
    window.matchMedia(
        "(prefers-color-scheme: dark)"
    ).matches
) {

    setTheme("dark");

} else {

    setTheme("light");

}


/* =========================================
   INITIALIZE
========================================= */

loadChat();

updateCharacterCount();

autoResize();

messageInput.focus();
</script>

</body>
</html>
